# Local development stack: PostgreSQL, Redis, Mailpit, API, worker.
# The mobile app runs on the host with Expo (see docs/local-dev.md).
#
#   cp .env.example .env
#   docker compose up -d postgres redis mailpit   # infrastructure only
#   docker compose watch                          # full stack with live source sync

name: weekly-planner

x-backend: &backend
  build:
    context: .
    dockerfile: docker/api.Dockerfile
    target: dev
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    mailpit:
      condition: service_started
  develop:
    watch:
      - action: sync
        path: ./apps/api/src
        target: /repo/apps/api/src
      - action: sync
        path: ./packages/shared/src
        target: /repo/packages/shared/src
      # Migrations run at start-up, so new migration files restart the process.
      - action: sync+restart
        path: ./apps/api/drizzle
        target: /repo/apps/api/drizzle
      - action: rebuild
        path: ./pnpm-lock.yaml
      - action: rebuild
        path: ./apps/api/package.json
      - action: rebuild
        path: ./packages/shared/package.json

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planner}
      POSTGRES_DB: ${POSTGRES_DB:-planner}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # AOF persistence so queued jobs (emails) survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    # Catches all outgoing email in dev. Web UI: http://localhost:8025
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  api:
    <<: *backend
    ports:
      # Host port is configurable; inside the container the API always listens on API_PORT=3000.
      - "${API_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  worker:
    <<: *backend
    command: ["pnpm", "turbo", "run", "dev:worker", "--filter=@planner/api..."]

volumes:
  pgdata:
  redisdata:
