<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets the app use the full iPhone screen; safe areas are handled in the app.
         maximum-scale=1 stops iPhone Safari zooming in on a focused text field and staying zoomed
         (taps then stopped registering); pinch-to-zoom still works, Safari ignores it for that. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- Installable web app (PWA): manifest, home-screen icon and standalone mode on iPhone. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Weekly Plan" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1917" media="(prefers-color-scheme: dark)" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #faf7f2;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #1b1917;
        }
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- iPhone Safari scrolls the whole page to show a focused field and often leaves it scrolled
         after the keyboard closes. The app never scrolls the page itself (body overflow: hidden),
         and a leftover offset makes taps on fixed layers such as dialogs land in the wrong place,
         so reset it once no text field is focused. -->
    <script>
      (function () {
        function isTextField(el) {
          return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
        }
        function resetScroll() {
          if (!isTextField(document.activeElement) && (window.scrollX || window.scrollY)) window.scrollTo(0, 0);
        }
        // Delayed so it never lands between touchstart and click of the tap that blurred the field.
        document.addEventListener('focusout', function () {
          setTimeout(resetScroll, 300);
        });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', function () {
            setTimeout(resetScroll, 300);
          });
        }
      })();
    </script>

    <!-- iPhone Safari sometimes reports a complete tap (touchstart + touchend on a button) but never
         dispatches the click, most often while the keyboard is open, and react-native-web only runs
         onPress on click. For a short tap that didn't move, send the click ourselves if Safari hasn't
         within a moment; a late native click for the same tap is then swallowed so it never fires twice. -->
    <script>
      (function () {
        var MOVE_PX = 10;
        var WAIT_MS = 350;
        var start = null;
        var pending = null;
        var swallowUntil = 0;
        function isTextField(el) {
          return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
        }
        // Shown in the touch diagnostics log when it's on.
        function note(msg) {
          if (window.__touchDiag) window.__touchDiag(msg);
        }
        document.addEventListener('touchstart', function (e) {
          var t = e.touches[0];
          start = e.touches.length === 1 ? { x: t.clientX, y: t.clientY, time: Date.now(), target: e.target, moved: false } : null;
        }, { capture: true, passive: true });
        document.addEventListener('touchmove', function (e) {
          var t = e.touches[0];
          if (start && (Math.abs(t.clientX - start.x) > MOVE_PX || Math.abs(t.clientY - start.y) > MOVE_PX)) start.moved = true;
        }, { capture: true, passive: true });
        document.addEventListener('touchcancel', function () { start = null; }, { capture: true, passive: true });
        // Bubble phase on document: runs after the app's own handlers, so a tap they cancelled is left alone.
        document.addEventListener('touchend', function (e) {
          var s = start;
          start = null;
          if (!s) return note('fallback skip: no start');
          if (s.moved) return note('fallback skip: moved');
          if (e.defaultPrevented) return note('fallback skip: prevented');
          if (Date.now() - s.time > 700) return note('fallback skip: long press');
          var target = s.target;
          if (!target || !target.isConnected) return note('fallback skip: target gone');
          if (isTextField(target) || target.closest('input,textarea,select,a[href]')) return;
          note('fallback armed');
          if (pending) clearTimeout(pending.timer);
          pending = {
            target: target,
            timer: setTimeout(function () {
              pending = null;
              if (!target.isConnected) return note('fallback skip: target gone');
              swallowUntil = Date.now() + 600;
              window.__syntheticClick = true;
              target.click();
              window.__syntheticClick = false;
            }, WAIT_MS),
          };
        }, { passive: true });
        document.addEventListener('click', function (e) {
          if (!e.isTrusted) return;
          if (pending) {
            clearTimeout(pending.timer); // Safari delivered the click itself.
            pending = null;
          } else if (Date.now() < swallowUntil) {
            note('fallback: late native click swallowed');
            e.stopPropagation(); // A late native click for a tap we already handled.
            e.preventDefault();
          }
          swallowUntil = 0;
        }, true);
      })();
    </script>

    <!-- Touch diagnostics (Settings → "Touch diagnostics"): an on-screen log of what Safari reports
         for each tap, to debug taps that don't register. Off by default; never blocks touches. -->
    <script>
      (function () {
        var enabled = false;
        try {
          enabled = localStorage.getItem('touchDiagnostics') === '1';
        } catch (e) {}
        if (!enabled) return;
        var lines = [];
        var panel;
        function describe(el) {
          if (!el || !el.tagName) return String(el);
          var label = el.getAttribute && (el.getAttribute('aria-label') || '');
          var text = (label || el.innerText || el.value || '').replace(/\s+/g, ' ').slice(0, 18);
          return el.tagName.toLowerCase() + (el.getAttribute && el.getAttribute('role') ? '[' + el.getAttribute('role') + ']' : '') + ' "' + text + '"';
        }
        function log(type, e) {
          var vv = window.visualViewport;
          var t = e && e.changedTouches && e.changedTouches[0];
          var y = t ? Math.round(t.clientY) : e && e.clientY != null ? Math.round(e.clientY) : '';
          lines.unshift(
            (performance.now() / 1000).toFixed(2) + ' ' + type + ' y=' + y +
              ' sY=' + Math.round(window.scrollY) +
              (vv && vv.scale !== 1 ? ' zoom=' + vv.scale.toFixed(2) : '') +
              (vv ? ' vvTop=' + Math.round(vv.offsetTop) + ' vvH=' + Math.round(vv.height) : '') +
              ' ' + describe(e && e.target),
          );
          lines.length = Math.min(lines.length, 14);
          if (!panel) {
            panel = document.createElement('pre');
            panel.style.cssText =
              'position:fixed;left:0;right:0;bottom:0;z-index:2147483647;margin:0;padding:4px 6px;' +
              'font:10px/1.3 ui-monospace,monospace;background:rgba(0,0,0,.78);color:#9f9;' +
              'pointer-events:none;white-space:pre-wrap;max-height:40vh;overflow:hidden';
            document.body.appendChild(panel);
          }
          panel.textContent = lines.join('\n');
        }
        window.__touchDiag = function (msg) { log(msg); };
        // The panel needs <body>; the version is on the Settings page.
        document.addEventListener('DOMContentLoaded', function () { log('diagnostics on (fallback v2)'); });
        ['touchstart', 'touchend', 'touchcancel', 'click', 'focusin', 'focusout'].forEach(function (type) {
          document.addEventListener(type, function (e) { log(type === 'click' && !e.isTrusted ? 'click(fallback)' : type, e); }, { capture: true, passive: true });
        });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', function () { log('vv-resize'); });
        }
      })();
    </script>

    <!-- Offline support: the service worker exists only in the production build (scripts/build-sw.js). -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
