packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency build scripts unless listed here.
onlyBuiltDependencies:
  - esbuild
  - '@nestjs/core'
  - workerd

# Reviewed and not needed: prebuilt binaries ship via optional deps; scarf is install telemetry.
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@scarf/scarf'
  - unrs-resolver

# Local fixes to dependencies (pnpm patch format). expo-sqlite: time-based sync timeout on web,
# see patches/expo-sqlite@58.0.14.patch.
patchedDependencies:
  expo-sqlite@58.0.14: patches/expo-sqlite@58.0.14.patch
