packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency build scripts unless listed here.
onlyBuiltDependencies:
  - esbuild
  - '@nestjs/core'

# Reviewed and not needed: prebuilt binaries ship via optional deps; scarf is install telemetry.
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@scarf/scarf'
  - unrs-resolver
